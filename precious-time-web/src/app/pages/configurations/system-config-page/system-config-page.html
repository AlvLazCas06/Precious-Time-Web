<app-sidebar></app-sidebar>
<div class="container-fluid p-4" style="margin-left: 250px">
  <!-- Header -->
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="fw-bold mb-1">Configuración Global</h2>
      <p class="text-muted mb-0">
        Personaliza categorías, colores, reglas de notificación y configuraciones del sistema
      </p>
    </div>
  </div>

  <!-- Tabs de navegación -->
  <ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="/config/category"> Categorías </a>
    </li>
    <li class="nav-item" role="presentation">
      <a
        class="nav-link active"
        routerLink="/config/system"
      >
        Sistema
      </a>
    </li>
  </ul>

  <!-- Contenido de tabs -->
  <div class="tab-content">
    <!-- Tab de Sistema (activo) -->
    <div class="tab-pane fade show active" id="sistema" role="tabpanel">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h5 class="fw-semibold mb-1 d-flex align-items-center gap-2">
                <i class="bi bi-gear"></i>
                Configuración del Sistema
              </h5>
              <p class="text-muted small mb-0">Configuraciones generales de la aplicación</p>
            </div>
          </div>

          <!-- Nombre del Sitio -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Nombre del Sitio</label>
            <input type="text" class="form-control" value="Precious Time" />
          </div>

          <!-- Idioma Predeterminado -->
          <div class="row mb-4">
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Idioma Predeterminado</label>
              <select class="form-select">
                <option selected>Español</option>
                <option>English</option>
                <option>Français</option>
                <option>Deutsch</option>
              </select>
            </div>
          </div>

          <!-- Zona Horaria -->
          <div class="row mb-4">
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold">Zona Horaria</label>
              <select class="form-select">
                <option selected>Europa/Madrid</option>
                <option>America/New_York</option>
                <option>America/Los_Angeles</option>
                <option>Asia/Tokyo</option>
                <option>Australia/Sydney</option>
              </select>
            </div>
          </div>

          <!-- Respaldo Automático -->
          <div class="mb-4 pb-3 border-bottom">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div class="fw-semibold">Respaldo Automático</div>
                <small class="text-muted">Realizar respaldos automáticos de la base de datos</small>
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="respaldoSwitch" checked />
              </div>
            </div>
          </div>

          <!-- Footer acciones -->
          <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <button class="btn btn-outline-secondary d-flex align-items-center gap-2">
              <i class="bi bi-arrow-clockwise"></i>
              Restablecer
            </button>
            <button class="btn btn-primary d-flex align-items-center gap-2">
              <i class="bi bi-floppy"></i>
              Guardar Cambios
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
