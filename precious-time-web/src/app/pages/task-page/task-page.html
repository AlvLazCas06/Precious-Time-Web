<div class="container-fluid p-4 bg-body min-vh-100 d-flex flex-column" [attr.data-bs-theme]="isDarkTheme ? 'dark' : 'light'">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-body-emphasis">Plantillas de Tareas</h2>
      <p class="text-body-secondary mb-0">Crea y gestiona plantillas de tareas para asignar a usuarios</p>
    </div>
  </div>

  <!-- Task Grid -->
  <div class="row g-4">
    @for (task of taskList; track task.id) {
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm task-card bg-body-tertiary">
        <div class="card-body p-4 d-flex flex-column">
          <h5 class="fw-bold text-body-emphasis mb-2">{{ task.title }}</h5>
          <p class="text-body-secondary mb-3 flex-grow-1">{{ task.description }}</p>

          <div class="d-flex gap-2 mb-3">
            <span class="badge rounded-pill px-3 py-2 border-0 badge-priority"
                  [ngClass]="getPriorityClass(task.priority)">
              {{ task.priority }}
            </span>
            <span class="badge rounded-pill px-3 py-2 border-0 badge-status"
                  [ngClass]="getStatusClass(task.status)">
              {{ task.status }}
            </span>
          </div>

          <div class="border-top pt-3 mt-auto">
            <p class="text-secondary small mb-1">Categoría</p>
            <p class="fw-medium text-body-emphasis mb-0">{{ task.category.name }}</p>
          </div>
        </div>
      </div>
    </div>
    } @empty {
      <div class="col-12 text-center py-5">
        <div class="text-body-secondary">
          <i class="bi bi-list-task display-1 d-block mb-3 opacity-25"></i>
          <p class="h5">No hay tareas creadas</p>
        </div>
      </div>
    }
  </div>

</div>
