<div
  class="d-flex flex-column align-items-center justify-content-center vh-100"
  style="background: linear-gradient(170deg, #e8f3fd 0%, #c9dff5 100%)"
>
  <!-- Clock icon -->
  <div
    class="bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm mb-3"
    style="width: 80px; height: 80px"
  >
    <i class="bi bi-clock fs-1" style="color: #17b8c8"></i>
  </div>

  <h2 class="fw-bold mb-1">Precious Time</h2>
  <p class="text-muted mb-4">Bienvenido de nuevo</p>

  <!-- Login card -->
  <div class="card border-0 shadow-sm rounded-4 p-3" style="width: 320px">
    <div class="card-body">
      <form [formGroup]="loginFormGroup">

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label small text-muted fw-semibold">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input
              type="email"
              class="form-control border-start-0"
              placeholder="maria@ejemplo.com"
              formControlName="usernameFormControl"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="mb-2">
          <label class="form-label small text-muted fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control border-start-0 border-end-0"
              placeholder="••••••••"
              formControlName="passwordFormControl"
            />
            <button
              type="button"
              class="input-group-text bg-white border-start-0"
              (click)="togglePassword()"
            >
              @if (showPassword) {
                <i class="bi bi-eye-slash text-muted"></i>
              } @else {
                <i class="bi bi-eye text-muted"></i>
              }
            </button>
          </div>
        </div>

        <!-- Forgot password -->
        <div class="text-end mb-4">
          <a href="#" class="small text-decoration-none" style="color: #17b8c8">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Submit -->
        <div class="d-grid">
          <button class="btn btn-primary btn-lg rounded-pill fw-semibold" (click)="login()">
            Iniciar sesión
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Register link -->
  <p class="mt-4 text-muted small">
    ¿No tienes cuenta?
    <a routerLink="/register" class="text-decoration-none fw-semibold" style="color: #17b8c8">
      Crear cuenta
    </a>
  </p>
</div>
