<div class="container-fluid vh-100">
    <div class="row h-100">
        <!-- Columna izquierda con la imagen -->
        <div class="col-md-6 left-panel d-flex align-items-center justify-content-center">
            <div class="logo-container">
                <img src="../../../assets/images/precious-time-logo-big.png" alt="Logo Precious Time"
                    class="logo-image">
            </div>
        </div>

        <!-- Columna derecha con el formulario -->
        <div class="col-md-6 right-panel d-flex align-items-center justify-content-center">
            <div class="login-form-container">
                <h1 class="login-title mb-5">Iniciar Sesión</h1>
                <form>
                    <div class="mb-4">
                        <input type="text" id="username" name="username" class="form-control form-control-lg"
                            placeholder="Usuario">
                    </div>
                    <div class="mb-4">
                        <input type="password" name="password" id="password" class="form-control form-control-lg"
                            placeholder="Contraseña">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
