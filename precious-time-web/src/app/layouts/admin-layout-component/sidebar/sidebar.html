<div class="d-flex flex-column h-100 bg-white border-end position-fixed top-0 start-0" style="width: 250px; z-index: 1000;">
    <div class="p-3 border-bottom">
        <div class="d-flex align-items-center gap-2 mb-2">
            <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white h4" style="width: 40px; height: 40px;">
                <i class="bi bi-clock"></i>
            </div>
            <div>
                <h5 class="mb-0 fw-semibold">Precious Time</h5>
                <small class="text-muted">Panel de administrador</small>
            </div>
        </div>
    </div>

    <nav class="flex-grow-1 p-3 overflow-auto">
        <ul class="nav flex-column gap-1">
            <li class="nav-item">
                <a routerLink="/dashboard" routerLinkActive="text-white bg-primary" [routerLinkActiveOptions]="{exact: true}" class="nav-link text-secondary d-flex align-items-center gap-2 rounded-3 py-2 px-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-grid" viewBox="0 0 16 16">
                        <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5zM2.5 2a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5zm6.5.5A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5zM10.5 2a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5zM1 10.5A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5zm6.5.5A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5z"/>
                    </svg>
                    <span>Panel de Control</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/users" routerLinkActive="text-white bg-primary" class="nav-link text-secondary d-flex align-items-center gap-2 rounded-3 py-2 px-3">
                    <i class="bi bi-people"></i>
                    <span>Gestión de Usuarios</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/analisys" routerLinkActive="text-white bg-primary" class="nav-link text-secondary d-flex align-items-center gap-2 rounded-3 py-2 px-3">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Análisis de Datos</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/config/category" routerLinkActive="text-white bg-primary" class="nav-link text-secondary d-flex align-items-center gap-2 rounded-3 py-2 px-3">
                    <i class="bi bi-gear"></i>
                    <span>Configuración</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="p-3 border-top">
        <button class="nav-link text-secondary d-flex align-items-center gap-2 rounded-3 py-2 px-3" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Cerrar Sesión</span>
        </button>
    </div>
</div>
