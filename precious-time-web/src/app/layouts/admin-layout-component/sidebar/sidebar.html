<div class="d-flex flex-column h-100 bg-body border-end position-fixed top-0 start-0" style="width: 250px; z-index: 1000;">
    <!-- Brand -->
    <div class="p-4 mb-2">
        <div class="d-flex align-items-center gap-3">
            <div class="logo-container shadow-sm">
                <i class="bi bi-clock fs-5"></i>
            </div>
            <div>
                <div class="sidebar-brand text-body-emphasis">Precious Time</div>
                <small class="text-body-secondary" style="font-size: 0.75rem;">Admin Dashboard</small>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-grow-1 px-3 overflow-auto custom-scrollbar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
                    <i class="bi bi-grid"></i>
                    <span>Panel Principal</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/users" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-people"></i>
                    <span>Usuarios</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/projects" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-briefcase"></i>
                    <span>Proyectos</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/categories" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-folder2"></i>
                    <span>Categorías</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/tasks" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-list-check"></i>
                    <span>Plantillas de Tareas</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/notifications" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-bell"></i>
                    <span>Notificaciones</span>
                </a>
            </li>
            <li class="nav-item">
                <a routerLink="/preference" routerLinkActive="active" class="nav-link">
                    <i class="bi bi-gear"></i>
                    <span>Preferencias</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Footer / Theme Toggle -->
    <div class="p-3 mt-auto border-top border-secondary-subtle">
        <button class="btn btn-link text-secondary text-decoration-none w-100 d-flex align-items-center justify-content-center gap-2 p-2" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span class="small">Cerrar Sesión</span>
        </button>
    </div>
</div>
